<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculadora">
        <input type="text" id="visor" readonly>

        <div class="botoes">
            <button class="limpar">C</button>
            <button>*</button>
            <button class="divisao">/</button>
            <button class="soma">+</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="subtracao">-</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="porcentagem">%</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>.</button>
            <button>0</button>
            <button class="igual">=</button>
        </div>
    </div>
    <script src="funcao.js"></script>
</body>

</html>
